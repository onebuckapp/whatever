name: release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: build (macos-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16+
        shell: bash
        run: |
          set -eu
          # xcodegen emits a project in the Xcode 16 format (object version
          # 77), which the image default Xcode (15.x on macos-14) cannot
          # open. Pick the newest installed Xcode 16+ instead of depending
          # on the image default, which drifts between images and over time.
          latest="$(
            for app in /Applications/Xcode_*.app; do
              [[ -d "${app}" ]] || continue
              ver="$(basename "${app}" .app)"
              ver="${ver#Xcode_}"
              ver="${ver#Xcode}"
              major="${ver%%.*}"
              [[ "${major}" =~ ^[0-9]+$ ]] && [[ "${major}" -ge 16 ]] || continue
              printf '%s %s\n' "${ver}" "${app}"
            done | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2-
          )"
          [[ -n "${latest}" ]] || { echo "ERROR: no Xcode 16+ found under /Applications"; ls -d /Applications/Xcode_*.app || true; exit 1; }
          echo ">> selecting Xcode: ${latest}"
          sudo xcode-select -s "${latest}"
          xcodebuild -version

      - uses: nimbase/setup-nim-action@main
        with:
          nim-version: '2.2.x'

      - name: Install clue
        shell: bash
        run: |
          set -eu
          arch="${{ runner.arch }}"
          case "${arch}" in
            X64)   asset="clue_macos-x86_64" ;;
            ARM64) asset="clue_macos-arm64";  ;;
            *)     echo "ERROR: unsupported macOS arch: ${arch}"; exit 1 ;;
          esac
          url="https://github.com/openpeeps/clue/releases/latest/download/${asset}.tar.gz"
          echo ">> downloading ${url}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL "${url}" -o "${work}/clue.tar.gz"
          tar xzf "${work}/clue.tar.gz" -C "${work}"
          bin="$(find "${work}" -type f -name 'clue' | head -n 1)"
          [[ -n "${bin}" ]] || { echo "ERROR: clue binary not found in archive"; exit 1; }
          chmod +x "${bin}"
          mkdir -p "$HOME/.clue/bin"
          install -m 0755 "${bin}" "$HOME/.clue/bin/clue"
          echo "$HOME/.clue/bin" >> "$GITHUB_PATH"

      - name: Install xcodegen
        shell: bash
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Install dependencies
        shell: bash
        working-directory: core/nim-core
        run: clue install --depsOnly

      - name: Test the Nim core
        shell: bash
        # Same flags as `make -C core test`: gate the release on the suites
        # running under the memory manager that ships (ARC).
        working-directory: core/nim-core
        run: clue test --threads:on --mm:arc -d:boogieNoCrashHandlers

      - name: Check the core ABI
        shell: bash
        run: make core && make check-abi

      - name: Build the app (Release)
        shell: bash
        run: make macos_release

      - name: Build the DMG
        shell: bash
        run: |
          set -eu
          # No Developer ID signing here: this matches the local ad-hoc
          # builds. A signed and notarized DMG is a separate step (Apple
          # Developer account, secrets, `codesign` + `notarytool`).
          app="macos/Build/Build/Products/Release/Whatever.app"
          [[ -d "${app}" ]] || { echo "ERROR: app not found: ${app}"; exit 1; }
          tag="${GITHUB_REF_NAME//\//-}"
          dmg="Whatever_${tag}_macos-${{ matrix.arch }}.dmg"
          rm -rf dmg-staging "${dmg}"
          mkdir -p dmg-staging
          cp -R "${app}" dmg-staging/
          cp README.md LICENSE dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Whatever" -srcfolder dmg-staging \
            -ov -format UDZO "${dmg}"
          rm -rf dmg-staging
          echo "DMG=${dmg}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: whatever-dmg-macos-${{ matrix.arch }}
          path: '*.dmg'

      - name: Build the app (Debug)
        shell: bash
        run: make macos

      - name: Package the Debug app
        shell: bash
        run: |
          set -eu
          # A debuggable sibling of the release DMG: unoptimized, with the
          # DEBUG-only diagnostics compiled in. Ships both as its own zip and
          # its own DMG (not inside the release DMG) so each stays
          # independently downloadable, and the bundle inside is renamed so
          # both copies can live side by side in /Applications without
          # overwriting each other.
          app="macos/Build/Build/Products/Debug/Whatever.app"
          [[ -d "${app}" ]] || { echo "ERROR: app not found: ${app}"; exit 1; }
          tag="${GITHUB_REF_NAME//\//-}"
          zip="Whatever_${tag}_macos-${{ matrix.arch }}-debug.zip"
          dmg="Whatever_${tag}_macos-${{ matrix.arch }}-debug.dmg"
          rm -rf debug-staging "${zip}"
          mkdir -p debug-staging
          cp -R "${app}" "debug-staging/Whatever Debug.app"
          # ditto, not zip: it keeps the bundle's symlinks and resource
          # forks intact, which plain zip does not.
          ditto -c -k --sequesterRsrc --keepParent \
            "debug-staging/Whatever Debug.app" "${zip}"
          rm -rf dmg-staging-debug "${dmg}"
          mkdir -p dmg-staging-debug
          cp -R "debug-staging/Whatever Debug.app" dmg-staging-debug/
          cp README.md LICENSE dmg-staging-debug/
          ln -s /Applications dmg-staging-debug/Applications
          hdiutil create -volname "Whatever Debug" -srcfolder dmg-staging-debug \
            -ov -format UDZO "${dmg}"
          rm -rf debug-staging dmg-staging-debug

      - uses: actions/upload-artifact@v4
        with:
          name: whatever-debug-macos-${{ matrix.arch }}
          path: |
            *-debug.zip
            *-debug.dmg

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: whatever-dmg-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: whatever-debug-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          tag="${{ github.ref_name }}"
          assets=(dist/*.dmg dist/*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "ERROR: no DMGs or zips found in dist/"
            exit 1
          fi
          echo ">> Releasing ${tag}: ${assets[*]}"
          gh release create "${tag}" --title "${tag}" --generate-notes "${assets[@]}"
          echo "release-url=https://github.com/${{ github.repository }}/releases/tag/${tag}" >> "$GITHUB_OUTPUT"
