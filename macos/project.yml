# XcodeGen spec. Never edit Whatever.xcodeproj by hand;
# change this file and run `make generate`.
name: Whatever

options:
  bundleIdPrefix: com.onebuckapp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  MijickPopups:
    url: https://github.com/Mijick/Popups
    from: 4.0.5

settings:
  base:
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Whatever:
    type: application
    platform: macOS
    bundleId: com.onebuckapp.whatever
    dependencies:
      - package: MijickPopups
      - target: WhateverStore
        embed: true
    sources:
      - path: Sources
      - path: Shared
      - path: Resources/Assets.xcassets
      - path: Resources/Homepage/home.html
        buildPhase: resources
      - path: Resources/Homepage/whatever_bg.jpg
        buildPhase: resources
      - path: Resources/Homepage/whatever_logo.svg
        buildPhase: resources
      - path: Resources/Blocklists/adaway-hosts.txt
        buildPhase: resources
      - path: Resources/Blocklists/whatever-extra.txt
        buildPhase: resources
      - path: Resources/Blocklists/snapshot-version.txt
        buildPhase: resources
      - path: Resources/Blocklists/NOTICE
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        # Declared here (not hardcoded in the plist) because xcodegen
        # rewrites the file at `path` on every `generate`, restoring any
        # values set there. Build-setting references survive: Xcode expands
        # them when it processes the plist, so 0.2.0 stays defined once in
        # `settings.base.MARKETING_VERSION` above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Claims http/https so the app appears in the system's Default
        # Browser list. Declared here (not hardcoded in the plist) because
        # xcodegen rewrites the file at `path` on every `generate`.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleURLSchemes:
              - http
              - https
            LSHandlerRank: Default
        # Registers HTML documents so macOS recognizes the app as a browser
        # candidate in the default-browser picker. Viewer, not Editor:
        # Whatever renders pages, it does not own the files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML Document
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML Document
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.xhtml
        # Declares the bundled XPC service to launchd. Without it the service is
        # present on disk but unregistered, and an NSXPCConnection to it fails
        # with "failed at lookup with error 3 - No such process".
        XPCServices:
          - WhateverStore
    entitlements:
      path: Resources/Whatever.entitlements
    settings:
      base:
        PRODUCT_NAME: Whatever
        # Stated explicitly because PRODUCT_NAME alone yields
        # `com.onebuckapp.Whatever`, and launchd refuses to launch an embedded
        # XPC service whose bundle ID is not prefixed by the app's. The
        # WhateverStore ID below has to sit under whatever this resolves to.
        PRODUCT_BUNDLE_IDENTIFIER: com.onebuckapp.whatever
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The one process that owns Whatever's persistent stores. boogie holds an
  # exclusive lock on a store path for that store's whole lifetime, so exactly
  # one process may open them; keeping that in a separate service is what lets
  # the app link no Nim code at all. The app reaches it over XPC, which also
  # keeps database work off the main thread.
  WhateverStore:
    type: xpc-service
    platform: macOS
    bundleId: com.onebuckapp.whatever.store
    sources:
      # Service-only sources: the app reaches all of this over XPC, and
      # linking it into the app would give the app a second process trying to
      # open stores the service already holds locked.
      - path: Store
        excludes:
          # The app's client lives in Sources/Storage/StoreClient.swift.
          - StoreClient.swift
      - path: Shared
      - path: Sources/Bridge/BrowserCore-Bridging-Header.h
    info:
      path: Resources/WhateverStore-Info.plist
      properties:
        # The dictionary key is `XPCService`, not `NSXPCService`. launchd lints
        # for the former and rejects the service with
        # "XPC Service Info.plist is missing XPCService dictionary", after which
        # every connection fails with "No such process".
        #
        # XcodeGen rewrites the Info.plist from `properties` plus the file at
        # `path`, so the dictionary has to be declared here.
        #
        # An Application service is a plain on-demand helper: launchd starts it
        # when the app first connects and terminates it once the app has been
        # idle. That matches the store's lifetime and avoids registering a Mach
        # service in launchd.
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
          # Matches the `dispatchMain()` call at the end of StoreMain.swift.
          RunLoopType: dispatch_main
          JoinExistingSession: false
          EnvironmentVariables: {}
    settings:
      base:
        PRODUCT_NAME: WhateverStore
        PRODUCT_BUNDLE_IDENTIFIER: com.onebuckapp.whatever.store
        # Nim backend (core/), linked only here. Its C ABI comes through the
        # same bridging header the app used to rely on.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/BrowserCore-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../core/build
        OTHER_LDFLAGS:
          - $(inherited)
          - -lbrowsercore

  WhateverTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.onebuckapp.whatever.tests
    sources:
      - path: Tests
    dependencies:
      - target: Whatever
    settings:
      base:
        PRODUCT_NAME: WhateverTests
        PRODUCT_BUNDLE_IDENTIFIER: com.onebuckapp.whatever.tests
        GENERATE_INFOPLIST_FILE: YES
